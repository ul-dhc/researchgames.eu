name: Update analytics snapshot
on:
  schedule:
    - cron: '3-58/5 * * * *'
  workflow_dispatch:
    inputs:
      refresh_riddles:
        description: 'Refresh riddle content now (otherwise checked once per 24 hours)'
        type: boolean
        default: true
  push:
    branches: [main]
    paths: ['stats/**', 'games/miklu-rezgis/**', 'games/muns-teirums/**', '.github/workflows/analytics-snapshot.yml']
permissions:
  contents: write
concurrency:
  group: analytics-snapshot
  # An explicit refresh or relevant code update must not sit behind an old queued run.
  cancel-in-progress: ${{ github.event_name != 'schedule' }}
jobs:
  update:
    # Use the standard ARM pool rather than the currently congested x64 queue.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test snapshot handling
        run: node --test stats/tests/*.test.mjs games/miklu-rezgis/tests/*.test.mjs games/muns-teirums/tests/*.test.mjs
      - name: Read last published snapshot
        run: |
          echo '{}' > games/miklu-rezgis/data/riddles-refresh.json
          if git ls-remote --exit-code --heads origin analytics-data; then
            git fetch --depth=1 origin analytics-data:refs/remotes/origin/analytics-data
            git show origin/analytics-data:stats.json > stats/snapshot.json
            for name in riddles.json miklu-dashboard.json riddles-refresh.json; do
              if git cat-file -e "origin/analytics-data:$name"; then
                git show "origin/analytics-data:$name" > "games/miklu-rezgis/data/$name"
              fi
            done
          fi
      - name: Read previous visit counts
        run: |
          if git cat-file -e origin/analytics-data:visits.json 2>/dev/null; then
            git show origin/analytics-data:visits.json > stats/visits.json
          fi
      - name: Read previous audience data
        run: |
          if git cat-file -e origin/analytics-data:audience.json 2>/dev/null; then
            git show origin/analytics-data:audience.json > stats/audience.json
          fi
      - name: Read previous Latgalian gameplay data
        run: |
          if git cat-file -e origin/analytics-data:latgalian.json 2>/dev/null; then
            git show origin/analytics-data:latgalian.json > stats/latgalian.json
          fi
      - name: Collect Latgalian gameplay events
        env:
          GOATCOUNTER_API_TOKEN: ${{ secrets.GOATCOUNTER_API_TOKEN }}
        run: node stats/scripts/update-latgalian.mjs
      - name: Collect audience distributions
        env:
          GOATCOUNTER_API_TOKEN: ${{ secrets.GOATCOUNTER_API_TOKEN }}
        run: node stats/scripts/update-audience.mjs
      - name: Collect page visits
        env:
          GOATCOUNTER_API_TOKEN: ${{ secrets.GOATCOUNTER_API_TOKEN }}
        run: node stats/scripts/update-visits.mjs
      - name: Collect all games and periods
        run: node stats/scripts/update-snapshot.mjs
      - name: Refresh detailed dashboard and due riddle content
        env:
          REFRESH_RIDDLES: ${{ github.event_name == 'push' || inputs.refresh_riddles == true }}
        run: node games/miklu-rezgis/scripts/update-data.mjs
      - name: Publish data branch
        run: |
          cp stats/latgalian.json "$RUNNER_TEMP/latgalian.json"
          cp stats/audience.json "$RUNNER_TEMP/audience.json"
          cp stats/visits.json "$RUNNER_TEMP/visits.json"
          cp stats/snapshot.json "$RUNNER_TEMP/stats.json"
          cp games/miklu-rezgis/data/riddles.json "$RUNNER_TEMP/riddles.json"
          cp games/miklu-rezgis/data/miklu-dashboard.json "$RUNNER_TEMP/miklu-dashboard.json"
          cp games/miklu-rezgis/data/riddles-refresh.json "$RUNNER_TEMP/riddles-refresh.json"
          rm games/miklu-rezgis/data/riddles-refresh.json
          git restore stats/latgalian.json stats/audience.json stats/visits.json stats/snapshot.json games/miklu-rezgis/data/riddles.json games/miklu-rezgis/data/miklu-dashboard.json
          if git show-ref --verify --quiet refs/remotes/origin/analytics-data; then
            git switch --force-create analytics-data origin/analytics-data
          else
            git switch --orphan analytics-data
          fi
          cp "$RUNNER_TEMP/latgalian.json" latgalian.json
          cp "$RUNNER_TEMP/audience.json" audience.json
          cp "$RUNNER_TEMP/visits.json" visits.json
          cp "$RUNNER_TEMP/stats.json" stats.json
          cp "$RUNNER_TEMP/riddles.json" riddles.json
          cp "$RUNNER_TEMP/miklu-dashboard.json" miklu-dashboard.json
          cp "$RUNNER_TEMP/riddles-refresh.json" riddles-refresh.json
          git add latgalian.json audience.json visits.json stats.json riddles.json miklu-dashboard.json riddles-refresh.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Update public analytics snapshot'
          git push origin HEAD:analytics-data
