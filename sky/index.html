<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>A living network of future game ideas — ResearchGames.eu</title>
  <meta name="description" content="Explore an interactive network of future research-based game ideas across academic disciplines.">
  <meta name="theme-color" content="#070a14">
  <meta property="og:title" content="A living network of future game ideas">
  <meta property="og:description" content="An interactive ResearchGames.eu network of future research-based game ideas.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://researchgames.eu/sky/">
  <link rel="canonical" href="https://researchgames.eu/sky/">
  <link rel="icon" href="assets/favicon/favicon.ico" sizes="any">
  <link rel="icon" href="assets/favicon/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/styles.css?v=20260917-network">
  <link rel="stylesheet" href="css/network-page.css?v=20260917-3">
  <script src="js/research-ideas-data.js" defer></script>
  <script src="js/research-network.js?v=20260917-1" defer></script>
</head>
<body class="network-page">
  <main>
    <section class="network-section" id="constellation" aria-labelledby="network-title">
      <div class="network-intro">
        <h1 id="network-title">A living network of future game ideas</h1>
        <span>Explore connections across academic disciplines. Select an idea to learn more.</span>
      </div>
      <div class="network-controls" aria-label="Network view controls">
        <button id="network-zoom-in" type="button" aria-label="Zoom in">+</button>
        <button id="network-zoom-out" type="button" aria-label="Zoom out">−</button>
        <button id="network-reset" type="button" aria-label="Reset network view">↺</button>
      </div>
      <svg id="research-network" role="img" aria-label="An interactive constellation representing connected fields of research"></svg>
      <aside class="network-card" id="network-card" aria-live="polite" hidden>
        <button class="network-card-pin" id="network-card-pin" type="button" aria-pressed="false" aria-label="Pin game idea to the board">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 17v5"></path><path d="M9 10.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V7a1 1 0 0 1 1-1 2 2 0 0 0 0-4H8a2 2 0 0 0 0 4 1 1 0 0 1 1 1z"></path></svg>
        </button>
        <button class="network-card-close" id="network-card-close" type="button" aria-label="Close game idea">×</button>
        <p class="network-card-field"></p>
        <h3></h3>
        <p class="network-card-description"></p>
        <div class="network-card-taxonomy"><span class="network-card-collection"></span><span class="network-card-tag"></span></div>
        <p class="network-card-availability"></p>
        <p class="network-card-status"></p>
        <a class="network-card-action" target="_blank" rel="noopener" hidden>Play game <span aria-hidden="true">↗</span></a>
      </aside>
    </section>
  </main>
</body>
</html>
